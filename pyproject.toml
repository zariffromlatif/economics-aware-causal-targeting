[project]
name = "economics-aware-causal-marketing-targeting"
version = "0.1.0"
description = "Robust Policy Learning for Incremental Revenue Under Budget and Campaign-Cost Uncertainty"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
    "statsmodels>=0.14.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pyyaml>=6.0",
    "tabulate>=0.9.0",
    "requests>=2.28.0",
    "tqdm>=4.65.0",
    "pulp>=2.7.0",
    "joblib>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "ipykernel>=6.25.0",
]
causal = [
    "econml>=0.15.0",
    "scikit-uplift>=0.5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
